<div class="app-content">
  <router-outlet></router-outlet>
</div>
<nav class="primary-navigation" [attr.aria-label]="'navigation.label' | transloco">
  <a
    routerLink="/"
    [queryParams]="{ board: 'departure' }"
    [class.active]="activeSection() === 'departure'"
    [attr.aria-current]="activeSection() === 'departure' ? 'page' : null"
  >
    <span class="navigation-icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 20h16M7 16 17 6M7 6h10v10" />
      </svg>
    </span>
    <span>{{ 'stationboard.titleDepartures' | transloco }}</span>
  </a>
  <a
    routerLink="/"
    [queryParams]="{ board: 'arrival' }"
    [class.active]="activeSection() === 'arrival'"
    [attr.aria-current]="activeSection() === 'arrival' ? 'page' : null"
  >
    <span class="navigation-icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 20h16M7 4l10 10M7 14h10V4" />
      </svg>
    </span>
    <span>{{ 'stationboard.titleArrivals' | transloco }}</span>
  </a>
  <a
    routerLink="/destination"
    [class.active]="activeSection() === 'destination'"
    [attr.aria-current]="activeSection() === 'destination' ? 'page' : null"
  >
    <span class="navigation-icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z" />
        <circle cx="12" cy="10" r="2.5" />
      </svg>
    </span>
    <span>{{ 'navigation.destination' | transloco }}</span>
  </a>
</nav>

@if (appUpdate.updateAvailable()) {
  <div
    class="update-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="update-title"
    aria-describedby="update-desc"
  >
    <div class="update-dialog">
      <div class="update-header">
        <h2 id="update-title">{{ 'updateDialog.title' | transloco }}</h2>
      </div>
      <div class="update-body">
        <p id="update-desc">
          {{ 'updateDialog.description' | transloco }}
        </p>
      </div>
      <div class="update-actions">
        <button
          type="button"
          class="sbb-primary-button"
          (click)="appUpdate.activateUpdate()"
          [disabled]="appUpdate.isActivating()"
        >
          {{
            appUpdate.isActivating()
              ? ('updateDialog.updating' | transloco)
              : ('updateDialog.reload' | transloco)
          }}
        </button>
      </div>
    </div>
  </div>
}
